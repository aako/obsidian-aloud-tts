name: Aloud - Verify and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must exactly match manifest.json, e.g. 0.15.1-ios.8)"
        required: true
        type: string

# Pull requests and normal pushes cannot publish releases.
permissions:
  contents: read

concurrency:
  group: aloud-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate source and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm via Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify release asset inputs
        run: |
          test -s packages/obsidian/main.js
          test -s packages/obsidian/styles.css
          test -s manifest.json

      - name: Stage verified PR test plugin
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/aloud-pr-plugin"
          mkdir -p "$stage"
          cp packages/obsidian/main.js "$stage/main.js"
          cp manifest.json "$stage/manifest.json"
          cp packages/obsidian/styles.css "$stage/styles.css"
          node - "$stage/manifest.json" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.id !== 'aloud-ios-fork' || !/^\d+\.\d+\.\d+-ios\.\d+$/.test(manifest.version)) {
            throw new Error('Unexpected test plugin identity or version');
          }
          NODE
          (cd "$stage" && sha256sum main.js manifest.json styles.css)

      - name: Upload PR-only Obsidian test plugin
        if: github.event_name == 'pull_request'
        id: pr_plugin
        uses: actions/upload-artifact@v4
        with:
          name: aloud-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aloud-pr-plugin/
          if-no-files-found: error
          retention-days: 14

      - name: Show PR test instructions
        if: github.event_name == 'pull_request'
        env:
          PR_PLUGIN_URL: ${{ steps.pr_plugin.outputs.artifact-url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          {
            echo '## Aloud test plugin for this PR'
            echo
            echo "[Download the verified PR test ZIP]($PR_PLUGIN_URL)"
            echo
            echo "Source head: $PR_HEAD_SHA. Artifact expires after 14 days."
            echo
            echo 'Extract main.js, manifest.json and styles.css into a **separate test vault**:'
            echo '`<test-vault>/.obsidian/plugins/aloud-ios-fork/`'
            echo 'Enable the plugin and restart Obsidian. Do not overwrite your everyday vault.'
            echo 'This test artifact is **not** a published release or BRAT update.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish explicitly approved release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm via Corepack
        run: corepack enable
      - name: Build the Obsidian plugin from the verified commit
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter obsidian-aloud-tts build
      - name: Verify requested version and reject existing tags or releases
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const version = process.env.RELEASE_VERSION || '';
          if (!/^\d+\.\d+\.\d+-ios\.\d+$/.test(version)) {
            throw new Error('Invalid Aloud iOS fork version: ' + version);
          }
          if (manifest.id !== 'aloud-ios-fork' || manifest.version !== version) {
            throw new Error(`Manifest mismatch: id=${manifest.id}, manifest version=${manifest.version}, requested=${version}`);
          }
          NODE
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists. Refusing to replace it." >&2
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | grep -q .; then
            echo "Tag $RELEASE_VERSION already exists. Refusing to move it." >&2
            exit 1
          fi
          test -s packages/obsidian/main.js
          test -s packages/obsidian/styles.css
          sha256sum packages/obsidian/main.js manifest.json packages/obsidian/styles.css
      - name: Publish BRAT-compatible GitHub prerelease
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --prerelease \
            --generate-notes \
            packages/obsidian/main.js \
            manifest.json \
            packages/obsidian/styles.css
      - name: Show published assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_VERSION" --json url,tagName,assets
